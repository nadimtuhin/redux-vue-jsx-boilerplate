name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # current LTS lines
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn unit

      - name: Build
        run: yarn build

      # e2e (`yarn e2e`) is not run here: it needs Java plus selenium-server
      # 2.53 and chromedriver 2.x, which cannot drive a current Chrome.
