name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # current LTS lines
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn unit

      - name: Build
        run: yarn build

      # selenium-server 2.53 runs on Java 21; newer JDKs reject its jar.
      # chromedriver matches the runner's Chrome via detect_chromedriver_version
      # in .npmrc.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: E2E tests
        run: yarn e2e
